<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
        }

        .forgot-container {
            width: 550px;
            padding: 50px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 15px;
        }

        p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 55px;
            padding: 0 18px;
            border: 2px solid #999;
            border-radius: 16px;
            font-size: 17px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            height: 60px;
            background: #222;
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #000;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #222;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="forgot-container">

        <h1>Forgot Password?</h1>

        <p>Enter your registered email to reset your password.</p>

        <form onsubmit="resetPassword(event)">

            <label>E-Mail</label>
            <input type="email"
                   id="email"
                   placeholder="Enter your email"
                   required>

            <button type="button" onclick="window.location.href='resetpassword.html'">
    Reset Password
</button>

        </form>

        <div class="back">
            <a href="index.html">← Back to Sign in</a>
        </div>

    </div>

    
    <script>
function resetPassword(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const account = JSON.parse(localStorage.getItem("studentAccount"));

    if (account && account.email === email) {
        localStorage.setItem("resetEmail", email);
        window.location.href = "reset-password.html";
    } else {
        alert("No account found with this email.");
    }
}
</script>

</body>
</html>
